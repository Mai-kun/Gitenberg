name: Test Suite

on:
    push:
        branches: [master, main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"
            - run: dotnet restore
            - run: dotnet test --no-restore

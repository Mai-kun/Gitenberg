<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Gitenberg</title>

  <!-- Same preview stack as the Mini App editor: marked (EasyMDE 2.18 bundles
       marked 4.x — the callout/kanban renderers expect its HTML shape),
       highlight.js for code blocks, EasyMDE css for preview table borders. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <!-- app.css carries the Telegram theme tokens and the whole preview look
       (callouts, kanban, front-matter) scoped under #editor-container .editor-preview -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/share.css">
</head>
<body>
  <main class="share-page">
    <header class="share-header">
      <span class="share-brand">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        Gitenberg
      </span>
    </header>

    <div id="share-state" class="share-state">
      <span class="share-state-spinner" aria-hidden="true"></span>
      <span id="share-state-text" data-i18n="loading">Загрузка…</span>
    </div>

    <article id="share-note" class="share-note" hidden>
      <h1 id="share-title"></h1>
      <div id="editor-container">
        <div class="editor-preview"></div>
      </div>
    </article>

    <footer class="share-footer">
      <span data-i18n="shareFooter">Поделиться заметкой можно в Gitenberg — заметки в вашем GitHub.</span>
    </footer>
  </main>

  <script type="module" src="js/share.js"></script>
</body>
</html>

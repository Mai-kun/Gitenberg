<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Gitenberg</title>

  <!-- Telegram WebApp SDK must load before any of our scripts -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- EasyMDE -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
  <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Dev-only bar: shown outside Telegram when initData is unavailable -->
  <div id="dev-bar" class="dev-bar" hidden>
    <label for="dev-telegram-id">Telegram ID для теста</label>
    <input id="dev-telegram-id" type="number" inputmode="numeric" min="1" value="123456" autocomplete="off">
  </div>

  <!-- ============ View: Registration ============ -->
  <section id="view-register" class="view" hidden>
    <div class="register-card">
      <div class="register-icon" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="40" height="40" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </div>
      <h1>Gitenberg</h1>
      <p class="hint">Подключите репозиторий GitHub, чтобы хранить заметки в формате Markdown.</p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="reg-token">GitHub Token</label>
          <input id="reg-token" type="password" autocomplete="off" placeholder="ghp_…" required>
        </div>
        <div class="field">
          <label for="reg-owner">Владелец репозитория</label>
          <input id="reg-owner" type="text" autocomplete="off" placeholder="octocat" required>
        </div>
        <div class="field">
          <label for="reg-repo">Название репозитория</label>
          <input id="reg-repo" type="text" autocomplete="off" placeholder="my-notes" required>
        </div>

        <div id="register-error" class="error-text" hidden></div>

        <button id="register-submit" type="submit" class="btn btn-primary">
          <span class="btn-label">Подключить GitHub</span>
        </button>
      </form>
    </div>
  </section>

  <!-- ============ View: Notes Explorer ============ -->
  <section id="view-explorer" class="view" hidden>
    <header class="explorer-header">
      <h1 id="explorer-title">Заметки</h1>
      <button id="btn-create-note" class="icon-btn" aria-label="Создать заметку" title="Создать заметку">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </header>

    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Путь"></nav>

    <div class="search-wrap">
      <input id="search-input" type="search" placeholder="Поиск по заметкам…" autocomplete="off">
      <button id="search-clear" class="icon-btn search-clear" aria-label="Очистить поиск" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div id="search-results" class="search-results" hidden></div>

    <div id="explorer-status" class="status-text" hidden></div>

    <main id="notes-list" class="notes-list" role="list"></main>

    <button id="fab-create" class="fab" aria-label="Создать заметку">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </section>

  <!-- ============ View: Markdown Editor ============ -->
  <section id="view-editor" class="view view-editor" hidden>
    <header class="editor-header">
      <button id="btn-editor-back" class="icon-btn" aria-label="Назад" title="Назад">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <h1 id="editor-title">Заметка</h1>
      <button id="btn-editor-delete" class="icon-btn icon-btn-danger" aria-label="Удалить заметку" title="Удалить заметку">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
        </svg>
      </button>
    </header>

    <div class="field editor-path-field">
      <label for="note-path">Файл</label>
      <input id="note-path" type="text" autocomplete="off" spellcheck="false" placeholder="notes/new-note.md">
    </div>

    <div id="editor-status" class="status-text" hidden></div>

    <div id="editor-container">
      <textarea id="note-markdown"></textarea>
    </div>

    <div class="editor-actions">
      <button id="btn-editor-save" type="button" class="btn btn-primary">
        <span class="btn-label">Сохранить</span>
      </button>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <!-- ============ Info sheet: folder / file properties ============ -->
  <div id="info-modal" class="info-modal" hidden>
    <div id="info-backdrop" class="info-backdrop"></div>
    <div class="info-sheet" role="dialog" aria-modal="true" aria-labelledby="info-title">
      <h2 id="info-title">Свойства</h2>
      <dl id="info-fields" class="info-fields"></dl>
      <a id="info-github-link" class="info-github-link" target="_blank" rel="noopener" hidden>Открыть на GitHub</a>
      <button id="info-close" type="button" class="btn btn-secondary">Закрыть</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
